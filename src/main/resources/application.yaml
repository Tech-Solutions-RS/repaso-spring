spring:
  application:
    name: innovation

  config:
    import: optional:file:.env[.properties]

  datasource:
    url: jdbc:mysql://localhost:3306/innovation?createDatabaseIfNotExist=true
    username: root
    password: ${env.database-password}
    driver-class-name: com.mysql.cj.jdbc.Driver
  
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true

server:
  port: 8081
  servlet:
    context-path: /api/v1

security:
  jwt:
    secret-key: ${env.jwt.secret-key} # Clave secreta (openssl rand -base64 32)
    token-expiration: ${env.jwt.token-expiration} # 10 min expresado en milisegundos
